[menu]
title=摩托车载具

[field.enabled]
type=bool
label=启用摩托车
description=关闭会立即下车并收回。战斗、过场、切换角色时自动下车。
default=true

[field.scale]
type=number
label=模型比例
description=模型缩放比例，自带模型基准长 2.2 米。修改实时生效。
min=0.8
max=2
step=0.05
default=1.15

[field.speed]
type=number
label=骑行最高速度
description=骑行最高速度（米/秒），倒车最高 3 m/s。
min=3
max=18
step=0.5
default=10

[field.max_steer]
type=number
label=最大转向角
description=车把最大转角（度），数值越大弯道转向半径越小。
min=10
max=50
step=1
default=35

[field.speed_steer_reduction]
type=number
label=高速转向收角强度
description=高速行驶时的转向自动收敛幅度。数值越小高速转向越灵敏。
min=0
max=1
step=0.05
default=0.5

[field.acceleration]
type=number
label=加速度
min=2
max=16
step=0.5
default=6

[field.terrain_grace]
type=number
label=地形离地容错时间
description=离地或腾空时的下车缓冲时间（秒）。
min=0
max=5
step=0.1
default=3

[field.terrain_drop]
type=number
label=允许离地落差
description=允许的最大离地下落高度（米），超过后自动下车。
min=1
max=12
step=0.5
default=6

[field.jump_enabled]
type=bool
label=骑乘空格跳跃
description=开启骑乘跳跃。关闭时人物跳跃会下车。
default=true

[field.jump_cooldown]
type=number
label=跳跃间隔
description=连续跳跃的最小间隔时间（秒）。
min=0.2
max=3
step=0.1
default=0.8

[field.jump_base_speed]
type=number
label=基础起跳速度
description=起跳初速度（米/秒）。
min=3
max=8
step=0.5
default=4

[field.jump_speed_boost]
type=number
label=速度跳跃增益
description=高速行驶时的跳跃高度加成系数。
min=0
max=1
step=0.05
default=0.4

[field.jump_gravity]
type=number
label=车辆跳跃重力
description=车辆腾空时的重力加速度（米/秒²），数值越大下落越快。
min=6
max=30
step=0.5
default=14

[field.jump_pitch]
type=number
label=跳跃俯仰幅度
description=腾空时车身前倾/抬头的最大俯仰角度。
min=0
max=30
step=1
default=18

[field.speed_fx]
type=bool
label=轮胎破风与拖尘
description=高速行驶时显示尾部拖尘与破风粒子特效。
default=true

[field.speed_fx_threshold]
type=number
label=轮胎特效起始速度
description=触发轮胎粒子特效的最低车速（米/秒）。
min=1
max=18
step=0.5
default=5

[field.speed_fx_intensity]
type=number
label=轮胎特效强度
description=粒子特效发射强度。
min=0
max=2
step=0.1
default=1

[field.ride_fov]
type=number
label=骑乘视野增量
description=骑乘时的镜头视野（FOV）增加角度，0 为不改变。
min=0
max=30
step=1
default=12

[field.fov_blend]
type=number
label=视野过渡时间
description=视野过渡平滑时间（秒）。
min=0.1
max=2
step=0.1
default=0.4

[field.seat_height]
type=number
label=座位高度
description=骑乘座垫高度调节。
min=0.5
max=1.2
step=0.05
default=0.8

[field.model_yaw]
type=enum
label=模型朝向
description=车辆模型默认朝向角度。
options=0|180
default=0
