[menu]
title=永动接线器

[field.enabled]
type=bool
label=启用摩托车
description=关闭会立即下车并收回。战斗、过场、切换角色时自动下车。
default=true

[field.scale]
type=number
label=模型比例
description=自带模型基准长 2.2 米；上下车保持相同比例。小体型通过前倾坐姿适配，。修改热应用。
min=0.8
max=2
step=0.05
default=1.15

[field.speed]
type=number
label=骑行最高速度
description=W/S 前进/倒车，A/D 转动车把；倒车最高 3 m/s。使用原生碰撞与移动管线，不保证服务器允许超出普通移动速度。
min=3
max=18
step=0.5
default=10

[field.max_steer]
type=number
label=最大转向角
description=车把转角（度），越大弯道越紧；同时提高行驶中的转向幅度。高速仍自动收小，短手臂按可达范围限制。保存后热应用。
min=10
max=50
step=1
default=35

[field.speed_steer_reduction]
type=number
label=高速转向收角强度
description=越小，高速时车把保留的转角越大，转弯半径越小。0 关闭速度收角，1 为旧版强度；默认 0.5，保存后热应用。仍受最大转向角和手臂可达范围限制。
min=0
max=1
step=0.05
default=0.5

[field.acceleration]
type=number
label=加速度
min=2
max=16
step=0.5
default=6

[field.seat_height]
type=number
label=座位高度
description=座垫基准高度；自动补偿骨盆/鞋底间隙，低值不压进车身。骨骼修改下车恢复。
min=0.5
max=1.2
step=0.05
default=0.8

[field.model_yaw]
type=enum
label=模型朝向
description=指定上车时的车头朝向；车辆式操控会沿车头前进/倒车，修改热应用。
options=0|180
default=0

[field.mount_key]
type=enum
label=下车按键
description=上车使用车旁原生交互；召唤/收回使用 R 工具轮盘。此按键仅骑乘时生效。
options=F7|F11
default=F7

[field.render_comparison]
type=bool
label=渲染对照（临时诊断）
description=可选诊断：停放时额外显示三个无碰撞对照物，上车或隐藏HUD时收起。正常使用建议关闭；已有配置保持。
default=false
